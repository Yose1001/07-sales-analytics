services:
  web:
    build: ./web
    ports:
      - "3003:80"
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "5004:8000"
    environment: &api-env
      DATABASE_URL: postgresql://sales:salespass@postgres:5432/salesdb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./api
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=2
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: salespass
      POSTGRES_DB: salesdb
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d salesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
  uploads:
